
name: Build SAVA APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Extract project ZIP
        run: |
          unzip -q SAVA_Automobile_Android_Project.zip
          
      - name: Build APK
        run: |
          cd SAVA_Automobile_Android_Project
          gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: SAVA-Automobile-APK
          path: SAVA_Automobile_Android_Project/app/build/outputs/apk/debug/app-debug.apk
